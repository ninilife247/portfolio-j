<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet resume">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="label">ABOUT ME</p>
        <div class="photo" id="photo"></div>
        <h2 class="name" id="name">&nbsp;</h2>
        <p class="job-title" id="title"></p>
        <p class="badge" id="badge" hidden></p>

        <ul class="contact">
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <div><small>NAME</small><span id="c-name"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </span>
            <div><small>EMAIL</small><span id="c-email"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            </span>
            <div><small>PHONE</small><span id="c-phone"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <div><small>LOCATION</small><span id="c-location"></span></div>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h1 class="big-title">PORTFOLIO</h1>
        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="info-row">
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
              EDUCATION
            </h3>
            <p id="education"></p>
          </div>
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
              SKILLS &amp; TOOLS
            </h3>
            <p id="skills"></p>
          </div>
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
              EXPERIENCE
            </h3>
            <p id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="empty">불러오는 중…</p>
          </div>
        </div>

        <p class="quote" id="quote"></p>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="intro">편하게 한마디 남겨 주세요.</p>

      <form class="gb-form" id="gb-form">
        <input id="gb-nickname" type="text" placeholder="별명 (20자까지)" maxlength="20" autocomplete="off">
        <input id="gb-message" type="text" placeholder="한마디 (200자까지)" maxlength="200" autocomplete="off">
        <button type="button" id="gb-submit">남기기</button>
      </form>
      <p class="gb-error" id="gb-error" hidden></p>

      <ul class="gb-list" id="gb-list">
        <li class="empty">불러오는 중…</li>
      </ul>
    </section>

    <p class="admin-link"><a href="admin.html">관리자</a></p>

  </main>

  <script src="script.js"></script>
</body>
</html>
